name: Deploy CASEFILE to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - name: Validate content (needs the study-guide source file)
        run: if [ -f src/content/source/study-guide.txt ]; then npm run validate; else echo "study-guide.txt not in repo; skipping validator"; fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Check output
        run: test -f dist/index.html && test -f dist/assets/main.js && test -f dist/favicon.svg
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
