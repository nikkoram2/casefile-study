<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CASEFILE: Shadows of Justice | Criminal Procedure Study Game</title>
<meta name="description" content="A free browser detective game for studying Criminal Procedure: searches, arrests and vehicle stops. No download, no account. A supplementary study resource.">
<meta name="theme-color" content="#0d1226"><meta property="og:title" content="CASEFILE: Shadows of Justice"><meta property="og:description" content="A free browser detective game for studying Criminal Procedure. Supplementary study resource.">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./assets/main.css">
</head>
<body>
<noscript>This study game needs JavaScript enabled.</noscript>
<div id="app"><div id="stage"><canvas id="game" aria-label="Game world" role="img"></canvas></div></div>
<div id="hud" hidden>
  <div class="l"><div id="hud-ch"></div><div id="hud-obj"></div></div>
  <div class="prog" title="Session progress"><i id="hud-bar"></i></div><span id="hud-time" class="muted"></span>
  <button id="btn-notebook" class="hbtn" title="Notebook (Tab)" aria-label="Open notebook"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h11a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6z"/><path d="M6 3v18M10 8h5M10 12h5"/></svg></button>
  <button id="mute" class="hbtn" title="Mute / unmute" aria-label="Toggle sound"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="w" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg></button>
  <button id="btn-full" class="hbtn" title="Fullscreen" aria-label="Toggle fullscreen"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  <button id="btn-pause" class="hbtn" title="Pause (Esc)" aria-label="Pause"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="currentColor"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></svg></button>
</div>
<div id="ui"></div><div id="fade"></div>
<script src="./assets/main.js"></script>
</body>
</html>
